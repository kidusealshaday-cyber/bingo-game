<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bingo Game</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #1a1a2e;
            color: white;
            margin: 0;
            padding: 20px;
        }
        h1 { color: #f1c40f; margin-bottom: 5px; }
        .grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
            max-width: 320px;
            margin: 20px auto;
        }
        .cell {
            background-color: #16213e;
            border: 2px solid #0f3460;
            border-radius: 8px;
            padding: 15px 0;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            user-select: none;
        }
        .cell.marked {
            background-color: #e94560;
            color: white;
            border-color: #ff2e63;
        }
        .btn {
            background-color: #27ae60;
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <h1>🎯 BINGO 🎯</h1>
    <p>የወጡትን ቁጥሮች በመጫን መስመር ለመሙላት ይሞክሩ!</p>

    <div class="grid" id="bingoCard"></div>

    <button class="btn" onclick="checkBingo()">ቢንጎ (Bingo)!</button>

    <script>
        // Telegram WebApp ን ማስነሳት
        const tg = window.Telegram.WebApp;
        tg.expand(); // ገጹን ሙሉ ስክሪን እንዲያደርገው

        // የቢንጎ ካርድ ማመንጫ (ከ1-75 ባሉት ቁጥሮች)
        function generateCard() {
            const grid = document.getElementById('bingoCard');
            grid.innerHTML = '';
            let numbers = Array.from({length: 75}, (_, i) => i + 1).sort(() => 0.5 - Math.random()).slice(0, 25);
            
            numbers.forEach((num, index) => {
                let cell = document.createElement('div');
                cell.className = 'cell';
                cell.innerText = num;
                cell.onclick = () => cell.classList.toggle('marked');
                grid.appendChild(cell);
            });
        }

        function checkBingo() {
            tg.showAlert("🎉 ቢንጎ ተጫንክ! የጨዋታው ማረጋገጫ በቦቱ በኩል እየተጣራ ነው...");
        }

        generateCard();
    </script>
</body>
</html>
