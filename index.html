<!DOCTYPE html>
<html lang="am">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Bingo</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #1a1e29;
      color: #ffffff;
      text-align: center;
      margin: 0;
      padding: 10px;
    }
    h1 {
      color: #f1c40f;
      margin: 5px 0;
      font-size: 22px;
    }
    .caller-box {
      background: #2c3e50;
      border: 2px solid #f1c40f;
      border-radius: 12px;
      padding: 10px;
      margin: 10px auto;
      max-width: 330px;
    }
    .current-number {
      font-size: 32px;
      font-weight: bold;
      color: #e74c3c;
    }
    .history {
      font-size: 12px;
      color: #bdc3c7;
      margin-top: 5px;
    }
    .board {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 6px;
      max-width: 330px;
      margin: 10px auto;
    }
    .cell {
      background-color: #34495e;
      border: 1px solid #4a6572;
      border-radius: 6px;
      aspect-ratio: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      user-select: none;
    }
    .cell.selected {
      background-color: #e74c3c;
      border-color: #c0392b;
    }
    .cell.free {
      background-color: #27ae60;
      border-color: #2ecc71;
    }
    .btn {
      background-color: #27ae60;
      color: white;
      border: none;
      padding: 10px 20px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 20px;
      cursor: pointer;
      width: 80%;
      max-width: 250px;
      margin-top: 5px;
    }
  </style>
</head>
<body>

  <h1>🎯 BINGO 🎯</h1>

  <!-- የቁጥር መጥሪያ ሳጥን -->
  <div class="caller-box">
    <div style="font-size: 12px; color: #aaa;">የወጣው ቁጥር (Current Call)</div>
    <div class="current-number" id="currentCall">Waiting...</div>
    <div class="history" id="callHistory">ያለፉት: -</div>
  </div>

  <div class="board" id="board"></div>

  <button class="btn" onclick="checkBingo()">ቢንጎ (Bingo)!</button>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    let drawnNumbers = [];
    let allNumbers = Array.from({length: 75}, (_, i) => i + 1);

    function generateBingoBoard() {
      const board = document.getElementById('board');
      board.innerHTML = '';
      
      const ranges = [
        [1, 15], [16, 30], [31, 45], [46, 60], [61, 75]
      ];

      let columns = [];
      for (let c = 0; c < 5; c++) {
        let col = [];
        let [min, max] = ranges[c];
        while (col.length < 5) {
          let num = Math.floor(Math.random() * (max - min + 1)) + min;
          if (!col.includes(num)) col.push(num);
        }
        columns.push(col);
      }

      for (let row = 0; row < 5; row++) {
        for (let col = 0; col < 5; col++) {
          const cell = document.createElement('div');
          cell.className = 'cell';

          if (row === 2 && col === 2) {
            cell.innerText = 'FREE';
            cell.classList.add('selected', 'free');
          } else {
            cell.innerText = columns[col][row];
            cell.onclick = function() {
              this.classList.toggle('selected');
            };
          }
          board.appendChild(cell);
        }
      }
    }

    // በየ 3 ሰከንዱ ቁጥር መጥሪያ
    function startCalling() {
      setInterval(() => {
        if (allNumbers.length === 0) return;
        
        let randomIndex = Math.floor(Math.random() * allNumbers.length);
        let num = allNumbers.splice(randomIndex, 1)[0];
        
        let letter = '';
        if (num <= 15) letter = 'B';
        else if (num <= 30) letter = 'I';
        else if (num <= 45) letter = 'N';
        else if (num <= 60) letter = 'G';
        else letter = 'O';

        drawnNumbers.unshift(`${letter}-${num}`);
        
        document.getElementById('currentCall').innerText = `${letter}-${num}`;
        document.getElementById('callHistory').innerText = "ያለፉት: " + drawnNumbers.slice(1, 6).join(', ');
      }, 3000);
    }

    function checkBingo() {
      alert("🎉 ቢንጎ ተፈትሿል!");
    }

    generateBingoBoard();
    startCalling();
  </script>
</body>
</html>
